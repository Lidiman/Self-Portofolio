name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (locked version)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (locked via package-lock)
        run: npm ci

      - name: Typecheck & Lint
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Smoke test build artifacts
        run: |
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          test -f dist/favicon.svg || (echo "dist/favicon.svg missing" && exit 1)
          test -f dist/avatar.webp || (echo "dist/avatar.webp missing" && exit 1)
          echo "Smoke test passed: all critical build artifacts present."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
